name: Installer

# Builds the frozen app, wraps it in the Inno Setup installer and test-installs it.
# Called by the release workflow, and run on pull requests that touch what goes into the installer
# (a Windows build with a 600 MB folder is too slow to run on every pull request). `src/**` is
# in the list because a new lazy import or data file is what the frozen build misses.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installer.yml"
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "src/**"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.md"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  installer:
    name: Build and test the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NexusVox and PyInstaller
        # A regular install, not editable: the build must contain what a wheel contains.
        run: pip install . "pyinstaller>=6,<7"

      - name: Build the app
        run: python packaging/build.py

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          $found = (Get-Command ISCC -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Build the installer
        run: python packaging/build_installer.py

      - name: Install, run, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "NexusVox-installed"
          $setup = "dist\installer\NexusVox-Setup.exe"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $config = Join-Path $env:APPDATA "NexusVox"
          $local = Join-Path $env:LOCALAPPDATA "NexusVox"
          $userFolders = @($config, "$local\data", "$local\logs", "$local\models")

          function Install($tasks) {
            # Per-user: nothing here may need elevation.
            $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"") + $tasks
            $process = Start-Process $setup -PassThru -ArgumentList $arguments
            if (-not $process.WaitForExit(300000)) { $process.Kill(); throw "The installer did not finish" }
            return $process.ExitCode
          }

          function Uninstall($extra) {
            Start-Process "$target\unins000.exe" -Wait -ArgumentList (@("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") + $extra)
            # The uninstaller hands over to a copy of itself in the temp folder, and the data is deleted after the
            # program folder is gone. Wait for that copy to finish, whatever it is called.
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 1
              $busy = Get-Process | Where-Object { $_.Name -like "unins*" -or $_.Path -like "$env:TEMP\is-*" }
            } while ($busy -and (Get-Date) -lt $deadline)
            if ($busy) { throw "The uninstaller did not finish" }
          }

          # --- Fresh install, with the autostart task.
          if ((Install @("/TASKS=autostart")) -ne 0) { throw "The installer failed" }
          foreach ($file in "NexusVox.exe", "unins000.exe", "LICENSE", "THIRD_PARTY_NOTICES.txt", "THIRD_PARTY_LICENSES.md") {
            if (-not (Test-Path "$target\$file")) { throw "$file was not installed" }
          }
          $value = (Get-ItemProperty $run).NexusVox
          if ($value -ne "`"$target\NexusVox.exe`"") { throw "Unexpected autostart value: $value" }

          # --- The installed app starts and stays up (the frozen build is the part that breaks quietly).
          $app = Start-Process "$target\NexusVox.exe" -PassThru
          $started = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { break }
            if (Get-ChildItem "$local\logs" -ErrorAction SilentlyContinue | Select-String -Pattern "NexusVox started" -Quiet) { $started = $true; break }
          }
          if (-not $started) {
            Get-ChildItem "$local\logs" -ErrorAction SilentlyContinue | Get-Content | Select-Object -Last 40
            throw "The installed NexusVox did not start (exited: $($app.HasExited))"
          }

          # --- A running NexusVox must stop an install over it, and the old build must stay intact.
          New-Item -ItemType File -Force "$target\_internal\stale-from-old-build.txt" | Out-Null
          Install @() | Out-Null
          if ($app.HasExited) { throw "Installing over a running NexusVox closed it" }
          if (-not (Test-Path "$target\_internal\stale-from-old-build.txt")) { throw "Setup replaced files under a running NexusVox" }
          $app.Kill()
          $app.WaitForExit()

          # --- Upgrade over the old build with the autostart task unticked.
          if ((Install @("/MERGETASKS=`"!autostart`"")) -ne 0) { throw "The upgrade failed" }
          if (Test-Path "$target\_internal\stale-from-old-build.txt") { throw "The upgrade left a file of the old build behind" }
          if (-not (Test-Path "$target\NexusVox.exe")) { throw "The upgrade lost NexusVox.exe" }
          if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).NexusVox) { throw "Unticking autostart on an upgrade left the Run value" }

          # --- The user's files live outside the install folder. A plain silent uninstall must keep them.
          New-Item -ItemType File -Force "$target\extensions\addon\marker.txt" | Out-Null
          foreach ($folder in $userFolders) {
            New-Item -ItemType Directory -Force $folder | Out-Null
            Set-Content "$folder\keep.txt" "x"
          }
          Uninstall @()
          if (Test-Path $target) { throw "The uninstaller left $target behind (add-ons included)" }
          foreach ($folder in $userFolders) {
            if (-not (Test-Path "$folder\keep.txt")) { throw "A silent uninstall deleted $folder" }
          }

          # --- With the switches the data and the models go, too.
          if ((Install @()) -ne 0) { throw "The reinstall failed" }
          Uninstall @("/DELETEDATA", "/DELETEMODELS")
          foreach ($folder in $userFolders) {
            if (Test-Path $folder) { throw "/DELETEDATA and /DELETEMODELS left $folder behind" }
          }

      - name: Upload the setup log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: ${{ runner.temp }}/setup.log
          if-no-files-found: ignore

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/installer/NexusVox-Setup.exe
          if-no-files-found: error
