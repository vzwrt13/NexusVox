name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.16.1"

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$HOME/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_py="$HOME/smoke/Scripts/python.exe"
          else
            smoke_py="$HOME/smoke/bin/python"
          fi
          echo "SMOKE_PY=$smoke_py" >> "$GITHUB_ENV"
          "$smoke_py" -m pip install --quiet dist/*.whl

      - name: Verify the installed wheel is usable
        shell: bash
        run: |
          set -euo pipefail
          # Run from outside the checkout. With the source tree as the working
          # directory an importable src/ can mask exactly the packaging mistakes
          # this step exists to catch.
          script="$(pwd)/scripts/packaging_smoke_test.py"
          cd "$HOME"
          "$SMOKE_PY" "$script"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
