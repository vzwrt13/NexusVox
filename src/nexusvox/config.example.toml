[general]
# Language for transcription: "en" or "de"
language = "en"
# Delay in ms between releasing modifier keys and sending Ctrl+V paste.
# Increase if text is not being injected at the cursor position.
injection_delay_ms = 500
# Enable automatic language detection per recording (experimental)
auto_language_detection = false
# How much the console log says: "DEBUG", "INFO", "WARNING" or "ERROR".
# DEBUG applies to NexusVox's own messages; other libraries stay at INFO.
# Takes effect on the next start.
log_level = "INFO"
# The log is also written to %LOCALAPPDATA%\NexusVox\logs (one file per day, kept for 7 days).
# Dictated text appears there shortened (first 20 characters and the length). true logs it in full,
# for debugging; the log may then contain what you said. The console always shows full text.
log_full_text = false
[hotkey]
# Press all listed modifiers simultaneously to record
# Modifier options: ctrl, shift, alt, win (may be empty when a key is set)
modifiers = ["ctrl", "shift", "alt"]
# Optional key that completes the combo: a letter, digit, F1-F24, SPACE, CAPS_LOCK,
# SCROLL_LOCK, PAUSE, INSERT, HOME, END, PAGE_UP or PAGE_DOWN. Empty: modifiers only.
# The key is swallowed while it is held as part of the combo, so it never types.
# Also editable in the dashboard Settings tab.
key = ""
# "hold": record while the modifiers are held (push-to-talk)
# "toggle": press once to start recording, press again to stop
# Also switchable in the dashboard Settings tab.
mode = "hold"
# Paste the last text again: start a recording with the hotkey, tap this key while every
# modifier is still down (Ctrl+Shift+Alt+V), let go. Nothing is transcribed; the text
# NexusVox pasted last is pasted once more. Same key names as `key`; empty turns it off.
# Also editable in the dashboard Settings tab.
paste_key = "V"
# Polish the selected text: select text, start a recording with the hotkey, tap this key
# while every modifier is down (e.g. "P" -> Ctrl+Shift+Alt+P) and say what to do ("make it
# shorter", "mach es formeller") - or nothing for a general polish. The selection is
# rewritten by the [llm] model and pasted over itself (Ctrl+Z in the app undoes it).
# Empty (default) turns it off. Also editable in the dashboard Settings tab.
polish_key = ""

[meeting]
# Meeting recording: your microphone and the system output (what the other participants say)
# are recorded to two tracks and transcribed into one transcript with numbered speakers. Start and stop
# it from the dashboard's Meetings tab or with this toggle hotkey; dictation keeps working during
# a meeting. Only record when every participant knows (see docs/MEETINGS.md).
# The hotkey needs at least one modifier and a key, and must not also be the dictation hotkey.
modifiers = ["ctrl", "alt"]
key = "M"
# Devices by name (see the dashboard Meetings tab). Empty: the system default devices.
mic_device = ""
output_device = ""
# Show "Inform all participants before you record" before each recording. The dashboard's
# "Don't show again" turns it off.
consent_hint = true
# Leave text you dictate during a meeting out of the meeting transcript (the microphone records
# it too, so it would land under your own voice). Applied when the meeting is transcribed; the audio files
# stay as recorded and the dictation time ranges are always stored in meeting.json.
leave_dictation_out = true
# The name your own voice (the microphone) gets in a meeting transcript. The other participants are
# numbered on from 2 ("Speaker 2", "Speaker 3", ...). Also editable in the dashboard Settings tab.
own_voice_label = "Speaker 1"
# Show a rough live transcript (your voice and "Others"; the stored transcript numbers the speakers) in the dashboard while a meeting records. The audio
# is sent to the transcription model in windows of about 6 seconds for the whole meeting, which costs GPU or CPU
# time, so it is off by default; also switchable in the dashboard Meetings tab. The transcript made after Stop
# is the one that is stored either way.
live_transcript = false

[audio]
# Sample rate in Hz (must match model expectation)
sample_rate = 16000
# Audio chunk size in bytes for WebSocket streaming
chunk_size = 4096

[inference]
# Inference server URL (automatically set when switching GPU-backed models).
# Ignored when a model runs in-process on CPU.
server_url = "http://localhost:8002/v1/audio/transcriptions"
# Transcription delay in ms (multiples of 80, range 80-2400)
transcription_delay_ms = 480
# Transcription model. In-process on CPU (no Docker): "parakeet-tdt-0.6b" (ONNX int8,
# ~670 MB download), "whisper-small", "whisper-base", "whisper-medium",
# "whisper-large-v3-turbo", "distil-whisper-large-v3" (EN), "distil-whisper-medium-en" (EN).
# Require NVIDIA GPU + Docker: "voxtral-mini-4b", "cohere-transcribe". Parakeet and the
# Whisper models also run there, in a container.
# Your own server (see [inference.custom] below): "custom-server".
# See the model table in README.md for resources and model licenses.
model = "parakeet-tdt-0.6b"
# Compute device: "auto" (detect CUDA, fall back to CPU), "cuda", or "cpu".
# Use "cpu" to force in-process Whisper, including for benchmarking on a GPU machine.
device = "auto"
# Optional compute type override. Defaults: "int8" on CPU, "float16" on GPU.
# Valid values for faster-whisper: "int8", "int8_float16", "float16", "float32".
# compute_type = "int8"

[inference.custom]
# Your own transcription server, used when model = "custom-server". Not started by
# NexusVox. Audio goes to this URL, so it leaves this PC if the server is remote.
# Protocol contract: docs/CUSTOM_SERVER.md in the NexusVox repository.
url = ""
# "http": WAV POSTed after the recording stops (OpenAI /v1/audio/transcriptions).
# "realtime": audio streamed while recording (vLLM /v1/realtime WebSocket).
protocol = "http"
# Sent to the server as the model field, and stored with each transcript.
model_name = "custom-server"

[database]
# SQLite database path (relative to config file or absolute)
path = "nexusvox.db"
# Directory for saved audio recordings (relative to database path)
audio_dir = "audio"
# Keep a WAV file of every recording (needed for playback in the Review tab).
# Also switchable in the dashboard Settings tab. Transcripts are saved either way.
store_audio = true

[os_commands]
# Enable "nexus" voice commands for OS-level window management.
# Say "nexus open chrome" to launch, "nexus focus discord" to bring to front, etc.
# Supported actions: open, close, focus, fullscreen, minimize, snap left, snap right
enabled = false

[os_commands.apps]
# Map app aliases to executable paths. Use the alias in voice commands.
# chrome = "C:/Program Files/Google/Chrome/Application/chrome.exe"
# discord = "C:/Users/YourUser/AppData/Local/Discord/Update.exe"
# terminal = "wt.exe"
# code = "code"

[voice_commands]
# Master switch for voice commands. English and German phrases are always both recognised.
enabled = true
# When true, spoken number words are converted to digits: "twenty five" / "fünfundzwanzig" → "25".
# Disabled by default — numbers pass through as spoken text.
numbers_as_digits = false
# When true, symbol substitutions are skipped but your symbol list is preserved.
# Structural commands (new line, tab, all caps) remain active.
# Useful for quick benchmarking without losing your configured symbols.
bypass_symbols = false
# When true, structural commands are skipped but your structural list is preserved.
bypass_structural = false
# Structural commands to recognise (German: neue Zeile, neuer Absatz, Tabulator, alles groß).
# Remove entries to type those words literally.
structural = ["new paragraph", "new line", "tab", "all caps"]
# When true, ending a dictation with "press enter" / "hit enter" (German: "Enter drücken",
# "drück Enter") pastes the text without the phrase, then presses Enter - e.g. to send a chat
# message. Saying only the phrase presses Enter alone. Disabled by default.
press_enter = false
# Symbol commands to recognise. Remove entries that conflict with your natural speech patterns.
#
# Safe defaults (rarely appear as plain words in dictation):
#   slash, backslash, pipe, tilde, asterisk,
#   open paren, close paren, open bracket, close bracket, open brace, close brace,
#   less than, greater than
#
# Opt-in (common English words — add only if you need them):
#   hash, percent, dash, hyphen, plus, equal, colon, star
symbols = [
  "slash", "backslash", "pipe", "tilde", "asterisk",
  "open paren", "close paren", "open bracket", "close bracket",
  "open brace", "close brace", "less than", "greater than"
]

[assistant]
# Forward "nexus assistant <anything>" to a voice assistant instead of typing it.
# The text goes to a local TCP port as `send <service> <text>`; the reply is logged.
# The assistant is a separate program you run yourself, not part of NexusVox - see
# docs/CONTROL_PORT.md for the contract. If nothing answers on the port, the sentence
# is typed at the cursor as usual.
enabled = false
host = "127.0.0.1"
port = 49730
service = "voice-assistant"
timeout_s = 5.0

[os_control]
# Command recordings: press command_key as the last key of the voice hotkey chord ("Y" by
# default, so Ctrl+Shift+Alt+Y; "OEM_102" is the "<" key on a German keyboard) and that
# recording is not typed - its transcript goes to a local TCP port as
# `send <service> <text>`, for example to a window switcher that understands "focus 3".
# Without the full chord the key types normally. NexusVox also sends `::show` when the
# key is pressed and `::hide` when the recording turns out empty or fails. The receiver
# is a separate program you run yourself, not part of NexusVox - see
# docs/CONTROL_PORT.md for the contract.
enabled = false
command_key = "Y"
host = "127.0.0.1"
port = 49730
service = "os-control"
timeout_s = 5.0

[translator]
# Translate what you dictated into English before it is typed. The recording and the
# transcript are stored as spoken; only the injected text is translated. Built for the
# personal-tooling `translator` server (TranslateGemma via Ollama on port 8003): German
# sentences are translated, English sentences pass through unchanged, so a mix works.
# If the server does not answer within timeout_s, the original text is typed instead.
enabled = false
url = "http://127.0.0.1:8003/translate"
timeout_s = 8.0

[mic_guard]
# Mute every other app's microphone (Discord, Teams, browser calls, ...) while the
# push-to-talk keys are held, so what you dictate is not broadcast to the call. Each
# app's own mute switch is put back exactly as it was on release; an app you muted
# yourself stays muted. Per-app WASAPI session mute, never the microphone device.
# If the keys are released but NexusVox never sees it, the microphones are restored
# after watchdog_s seconds; a crash mid-hold is repaired on the next start.
# Discord ignores per-session mute: bind Discord's own "Push to Mute" keybind to the
# NexusVox hotkey instead (Settings > search "Keybinds").
# Also switchable in the dashboard Settings tab.
enabled = false
watchdog_s = 30.0

[feedback]
# How a dictation shows that it is recording and typing: "sound" (the start and stop
# chimes), "visual" (a small live waveform at the bottom centre of the screen, which
# never takes focus and ignores the mouse) or "both". Also switchable in the dashboard
# Settings tab, without a restart. Meeting recordings never show the waveform.
mode = "sound"

[llm]
# The language model server polish uses. NexusVox does not ship a model: run Ollama
# (https://ollama.com, then `ollama pull gemma4:e4b`) or any OpenAI-compatible server.
# protocol: "ollama" (url without /v1; turns a reasoning model's thinking off) or
# "openai" (url up to /v1, e.g. http://127.0.0.1:1234/v1 for LM Studio).
# If the server is down or fails, the selection stays as it was (error beep).
url = "http://127.0.0.1:11434"
protocol = "ollama"
# gemma4:e4b: ~4.6 GB VRAM, ~0.5 s per polish on an RTX 5070 Ti, keeps tone and language.
# Mind the VRAM the speech model needs; bigger models (e.g. gemma4:12b, ~8 GB) polish better.
model = "gemma4:e4b"
# Sent as a Bearer token when set (cloud or protected servers). Leave empty for local ones.
api_key = ""
timeout_s = 60.0
# Ollama only: how long the model stays loaded after a request. Shorter frees the VRAM
# sooner (the speech model needs its share); the first request after unloading takes 10-50 s.
keep_alive = "10m"

[cleanup]
# Tidy every dictation through the [llm] model before it is typed (same model as polish).
# "off" (default), "light": removes fillers ("um", "äh"), false starts and repeated words and
# fixes punctuation, keeps the wording; "medium": also grammar, slightly more concise.
# Adds ~0.6 s per dictation with gemma4:e4b. The transcript is saved as spoken. A reply that
# does not look like the dictation cleaned up (an answer, a translation, a lost line break or
# snippet) is ignored, and dictations under 3 words are not sent. Also in the dashboard.
level = "off"
# A model still loading (10-50 s after [llm].keep_alive ran out) must not hold the dictation
# up: after this many seconds it is typed unchanged. NexusVox loads the model at start and
# when cleanup is switched on; a longer keep_alive keeps it loaded (and its VRAM in use).
timeout_s = 3.0

[polish]
# Polish in terminals too (Windows Terminal, console, Git Bash, VS Code/Orca terminals).
# A terminal does not report its selection, so polish copies it with Ctrl+C - which
# interrupts the running program when nothing is selected - and the rewritten text is
# pasted at the prompt, not over the selection. Off: polish plays the error beep there.
# Also switchable in the dashboard Settings tab.
in_terminals = false

[learn_from_edits]
# After each paste, keep reading the text field you dictated into (UI Automation) for
# window_s seconds. Words you correct there become dictionary suggestions in the dashboard
# (Settings > Correction Dictionary), which you accept or dismiss; nothing is added on its
# own. Password fields are never read, and translated or "press enter" dictations are
# skipped. Also switchable in the dashboard Settings tab.
enabled = false
window_s = 20.0

[remote_mic]
# Let a phone use NexusVox as its speech recogniser: hold its bubble to dictate, the audio
# runs through the same pipeline as the hotkey (dictionary, voice commands, translation)
# and the text goes back to the phone, which inserts it there. Nothing is typed on this
# PC. The phone streams 16 kHz PCM16 over a WebSocket to host:port and must send the
# token as "Authorization: Bearer <token>". Set a long random token and bind host to a private address such as this PC's
# Tailscale IP, not 0.0.0.0. Off, or with an empty token, nothing listens.
# Contract for phone apps: docs/REMOTE_MIC.md.
enabled = false
host = "127.0.0.1"
port = 47393
token = ""
