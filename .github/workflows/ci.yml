name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.16.1"

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the commit history via `git log -p`, which a shallow
          # clone does not contain. Without this the job only sees one commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Pinned by checksum, not just by tag: a retagged or tampered release
          # must not be able to run with repository access.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        # --redact keeps any match out of the build log. A CI log is not the place
        # to print a credential -- especially once this repository is public.
        run: gitleaks git --no-banner --redact --verbose .

  package:
    name: Packaging smoke test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$HOME/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_py="$HOME/smoke/Scripts/python.exe"
          else
            smoke_py="$HOME/smoke/bin/python"
          fi
          echo "SMOKE_PY=$smoke_py" >> "$GITHUB_ENV"
          "$smoke_py" -m pip install --quiet dist/*.whl

      - name: Verify the installed wheel is usable
        shell: bash
        run: |
          set -euo pipefail
          # Run from outside the checkout. With the source tree as the working
          # directory an importable src/ can mask exactly the packaging mistakes
          # this step exists to catch.
          script="$(pwd)/scripts/packaging_smoke_test.py"
          cd "$HOME"
          "$SMOKE_PY" "$script"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
