services:
  parakeet-fastapi:
    profiles: [ "parakeet" ]
    build:
      context: .
      dockerfile: Dockerfile.parakeet
    image: nexusvox-parakeet:latest
    runtime: nvidia
    container_name: nexusvox-parakeet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "8002:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped

  whisper-fastapi:
    profiles: [ "whisper" ]
    build:
      context: .
      dockerfile: Dockerfile.whisper
    image: nexusvox-whisper:latest
    runtime: nvidia
    container_name: nexusvox-whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "8003:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped

volumes:
  huggingface-cache:
